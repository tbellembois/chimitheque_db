        generator: pattern
        params:
          regex: "^(?P<group1>[0-9]{2,7})-(?P<group2>[0-9]{2})-(?P<checkdigit>[0-9]{1})$"
        constraints:
          unique: true
      - name: cas_number_cmr
        generator: choice
        params:
          choices: [C1A, M1A, R1A, C1B, M1B, R1B, C2, M2, R2]

    - name: category
